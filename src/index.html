<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Robin Screening Guide</title>
  <meta name="description" content="Explore general health screenings with Robin.">
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
  <style>
    :root{--green:#00a878;--dark:#073c31;--paper:#fff;--muted:#526b65;--pulse-seconds:.8s}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:var(--dark)}
    button,input,a{font:inherit}.shell{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;pointer-events:none}
    .panel{pointer-events:auto;width:min(520px,calc(100% - 24px));max-height:72vh;overflow:auto;margin:12px auto max(12px,env(safe-area-inset-bottom));padding:22px;border:1px solid #d6e7e1;border-radius:26px;background:#fffffff5;box-shadow:0 18px 50px #052c2450;backdrop-filter:blur(14px)}
    h1{margin:.2rem 0 .7rem;font-size:clamp(25px,7vw,38px);line-height:1.08}h2{margin:1rem 0 .2rem;font-size:17px}p{line-height:1.45}.eyebrow{margin:0;color:var(--green);font-size:12px;font-weight:900;letter-spacing:.12em;text-transform:uppercase}
    button,.link{min-height:48px;border-radius:14px;cursor:pointer}.primary,.secondary{display:block;width:100%;margin-top:10px;padding:12px 16px;border:0;text-align:center;font-weight:800;text-decoration:none}
    .primary{background:var(--green);color:#fff}.secondary{background:#e7f5f0;color:var(--dark)}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffd54f;outline-offset:3px}
    .choices,.screening-list{display:grid;gap:9px}.choice,.screening{padding:13px;border:1px solid #c9dfd7;background:#fff;color:var(--dark);text-align:left}.screening span{display:block;margin-top:5px;color:var(--muted);font-size:14px;line-height:1.35}
    .privacy,.source{color:var(--muted);font-size:12px}.chips{display:flex;gap:7px;flex-wrap:wrap}.chips button{min-height:40px;padding:8px 11px;border:1px solid #c9dfd7;background:#fff}
    label{display:block;margin:14px 0 5px;font-weight:800}input{width:100%;min-height:48px;padding:10px;border:1px solid #9ebbb1;border-radius:12px}.answer{margin-top:12px;padding:14px;border-left:5px solid var(--green);background:#eef8f4;line-height:1.45}
    progress{width:100%;height:18px}.pulse-camera{position:fixed;left:-9999px;width:64px;height:64px}
    .fallback{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle,#e8fff7,#bfeadb)}
    .fallback model-viewer{width:100%;height:68vh}.fallback::after{content:"";position:absolute;width:70px;height:70px;border:8px solid #00b67a55;border-radius:50%;animation:pulse var(--pulse-seconds) infinite ease-out}
    .fallback[hidden]{display:none}@keyframes pulse{to{transform:scale(2);opacity:0}}
    body[data-robin-mode="3d"] canvas{visibility:hidden}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    .simulator{position:fixed;z-index:80;top:max(8px,env(safe-area-inset-top));left:8px;width:min(330px,calc(100vw - 16px));max-height:56vh;overflow:auto;padding:12px;border:2px solid #6941c6;border-radius:16px;background:#161225ed;color:#fff;font-size:12px;box-shadow:0 12px 40px #0008}
    .simulator[hidden]{display:none}.simulator h2{margin:0;font-size:15px}.simulator__grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.simulator button,.simulator select{min-height:36px;padding:6px;border:1px solid #8f7ad0;border-radius:8px;background:#2c2347;color:#fff}.simulator pre{white-space:pre-wrap;margin:8px 0 0;padding:8px;border-radius:8px;background:#0d0a17;color:#d9cffb;max-height:110px;overflow:auto}.simulator.is-collapsed>*:not(.simulator__head){display:none}.simulator__head{display:flex;align-items:center;justify-content:space-between}.simulator__head button{min-height:32px}
  </style>
</head>
<body>
  <div id="robin-3d" class="fallback" hidden aria-label="Screen-based 3D Robin">
    <model-viewer src="./assets/robin.glb" alt="Robin, the HealthHub guide" camera-controls auto-rotate interaction-prompt="none"></model-viewer>
  </div>
  <video id="pulse-video" class="pulse-camera" playsinline muted aria-hidden="true"></video>
  <aside id="simulator" class="simulator" hidden aria-label="Robin journey simulator"></aside>
  <div class="shell">
    <main id="journey" class="panel" tabindex="-1" aria-live="polite"></main>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
