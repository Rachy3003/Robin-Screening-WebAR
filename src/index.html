<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Robin Screening Guide</title>
  <meta name="description" content="Explore general health screenings with Robin.">
  <script crossorigin="anonymous" src="./external/runtime/runtime.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/engine-binary@1/dist/xr.js" async crossorigin="anonymous" data-preload-chunks="slam"></script>
  <script src="https://cdn.jsdelivr.net/npm/@8thwall/landing-page@1/dist/landing-page.js" crossorigin="anonymous"></script>
  <style>
    :root{--green:#008f69;--green-dark:#006b50;--dark:#073c31;--paper:#fff;--muted:#49645d;--line:#bfd8cf;--soft:#e7f5f0;--warning:#7a4d00;--pulse-seconds:.8s}
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:Arial,sans-serif;color:var(--dark);-webkit-text-size-adjust:100%}
    button,input,a{font:inherit}.shell{position:fixed;inset:0;z-index:30;display:flex;align-items:flex-end;pointer-events:none}.shell[hidden]{display:none}
    .panel{pointer-events:auto;width:min(520px,calc(100% - 24px));overflow:auto;overscroll-behavior:contain;margin:12px auto max(12px,env(safe-area-inset-bottom));padding:24px;border:1px solid #d6e7e1;border-radius:26px;background:#fff;box-shadow:0 18px 50px #052c2450}
    .panel--conversation{max-height:38dvh}.panel--sheet{max-height:45dvh}.panel--detail{max-height:72dvh}
    h1{margin:.25rem 0 .75rem;font-size:clamp(25px,7vw,36px);line-height:1.18;outline:none}h2{margin:1.25rem 0 .25rem;font-size:18px;line-height:1.3}p{font-size:16px;line-height:1.5}.eyebrow{margin:0;color:var(--green-dark);font-size:14px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
    button,.link{min-height:48px;border-radius:14px;cursor:pointer;transition:transform 160ms ease,background 160ms ease}.primary,.secondary{display:block;width:100%;margin-top:12px;padding:13px 16px;border:0;text-align:center;font-weight:800;text-decoration:none}
    .primary{background:var(--green-dark);color:#fff}.primary:hover{background:#00533e}.secondary{background:var(--soft);color:var(--dark)}button:active,.link:active{transform:scale(.985)}button:disabled{cursor:wait;opacity:.62}
    button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #ffd54f;outline-offset:3px}
    .choices,.screening-list{display:grid;gap:10px}.choice,.screening{min-height:52px;padding:14px;border:1px solid var(--line);background:#fff;color:var(--dark);text-align:left}.choice.is-selected{border:3px solid var(--green-dark);background:var(--soft)}.screening span{display:block;margin-top:6px;color:var(--muted);font-size:14px;line-height:1.45}
    .privacy,.source{color:var(--muted);font-size:14px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chips button{min-height:44px;padding:9px 12px;border:1px solid var(--line);background:#fff;color:var(--dark)}
    label{display:block;margin:16px 0 6px;font-weight:800}input{width:100%;min-height:48px;padding:11px;border:1px solid #7e9f95;border-radius:12px;font-size:16px}.answer{margin-top:12px;padding:14px;border-left:5px solid var(--green);background:#eef8f4;font-size:16px;line-height:1.5}
    .sheet-handle{width:42px;height:5px;margin:-10px auto 14px;border-radius:99px;background:#abc8be}.actions{display:grid;grid-template-columns:1fr;gap:8px}
    .status-chip{position:fixed;z-index:45;top:max(12px,env(safe-area-inset-top));left:50%;max-width:min(430px,calc(100% - 24px));min-height:44px;transform:translateX(-50%);padding:11px 16px;border:1px solid #cae0d8;border-radius:999px;background:#fff;color:var(--dark);font-size:15px;font-weight:800;line-height:1.35;text-align:center;box-shadow:0 8px 28px #052c2438}.status-chip[hidden]{display:none}.status-chip[data-kind="warning"]{border-color:#e0b95f;color:var(--warning)}
    .robin-controls{position:fixed;z-index:44;right:max(12px,env(safe-area-inset-right));top:50%;display:grid;gap:8px;transform:translateY(-50%)}.robin-controls[hidden]{display:none}.robin-controls button{width:48px;height:48px;border:1px solid var(--line);border-radius:50%;background:#fff;color:var(--dark);font-size:22px;font-weight:900;box-shadow:0 7px 22px #052c2430}
    .sr-only{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
    progress{width:100%;height:18px}.pulse-camera{position:fixed;left:-9999px;width:64px;height:64px}
    .fallback{position:fixed;inset:0;z-index:10;display:grid;place-items:center;background:radial-gradient(circle,#e8fff7,#bfeadb)}
    .fallback model-viewer{width:100%;height:68vh}.fallback::after{content:"";position:absolute;width:70px;height:70px;border:8px solid #00b67a55;border-radius:50%;animation:pulse var(--pulse-seconds) infinite ease-out}.fallback.is-static model-viewer{display:none}.fallback.is-static::before{content:"Robin";display:grid;place-items:center;width:150px;height:150px;border-radius:50%;background:var(--green-dark);color:#fff;font-size:28px;font-weight:900}
    .fallback[hidden]{display:none}@keyframes pulse{to{transform:scale(2);opacity:0}}
    body[data-robin-mode="3d"] canvas{visibility:hidden}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
    .simulator{position:fixed;z-index:80;top:max(8px,env(safe-area-inset-top));left:8px;width:min(330px,calc(100vw - 16px));max-height:56vh;overflow:auto;padding:12px;border:2px solid #6941c6;border-radius:16px;background:#161225ed;color:#fff;font-size:12px;box-shadow:0 12px 40px #0008}
    .simulator[hidden]{display:none}.simulator h2{margin:0;font-size:15px}.simulator__grid{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:8px}.simulator button,.simulator select{min-height:44px;padding:6px;border:1px solid #8f7ad0;border-radius:8px;background:#2c2347;color:#fff}.simulator pre{white-space:pre-wrap;margin:8px 0 0;padding:8px;border-radius:8px;background:#0d0a17;color:#d9cffb;max-height:110px;overflow:auto}.simulator.is-collapsed>*:not(.simulator__head){display:none}.simulator__head{display:flex;align-items:center;justify-content:space-between}.simulator__head button{min-height:44px}
    @media(orientation:landscape) and (max-height:620px){.shell{align-items:center;justify-content:flex-end}.panel{width:min(48vw,520px);max-height:calc(100dvh - 24px);margin:12px max(12px,env(safe-area-inset-right)) 12px 12px}.status-chip{left:max(12px,env(safe-area-inset-left));transform:none;max-width:44vw}.fallback model-viewer{width:52vw;height:100vh;margin-right:48vw}}
    @media(max-height:560px) and (orientation:portrait){.panel--conversation,.panel--sheet{max-height:55dvh}}
  </style>
</head>
<body>
  <div id="robin-3d" class="fallback" hidden aria-label="Screen-based 3D Robin">
    <model-viewer src="./assets/robin.glb" alt="Robin, the HealthHub guide" camera-controls auto-rotate interaction-prompt="none"></model-viewer>
  </div>
  <video id="pulse-video" class="pulse-camera" playsinline muted aria-hidden="true"></video>
  <aside id="simulator" class="simulator" hidden aria-label="Robin journey simulator"></aside>
  <div id="status-chip" class="status-chip" hidden></div>
  <div id="robin-controls" class="robin-controls" hidden>
    <button data-rotate="-1" aria-label="Turn Robin left">↶</button>
    <button data-rotate="1" aria-label="Turn Robin right">↷</button>
  </div>
  <div id="journey-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>
  <div class="shell" hidden>
    <main id="journey" class="panel"></main>
  </div>
  <script src="bundle.js"></script>
</body>
</html>
